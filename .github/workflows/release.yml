name: Release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify single-release contract
        run: python scripts/release_contract.py "$GITHUB_REF_NAME"
      - name: Verify source before release
        run: |
          bash scripts/test_unit.sh
          python scripts/check_docs.py
          python -m compileall -q src scripts tests clients/python
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          node --check clients/node/translategemma-client.mjs
          python scripts/secret_scan.py .
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_release_artifacts.sh "$GITHUB_REF_NAME" dist
          cd dist
          sha256sum --check -- *.sha256
          md5sum --check -- *.md5
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-and-kaggle-notebook-v1.0.0
          path: dist/*
      - name: Refresh the single GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="TranslateGemma 27B IT v1.0.0 — Kaggle TPU v5e-8 Text + Vision"
          notes="RELEASE_NOTES_v1.0.0.md"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 --verify-tag --title "$title" --notes-file "$notes"
            gh release upload v1.0.0 dist/* --clobber
          else
            gh release create v1.0.0 dist/* --verify-tag --title "$title" --notes-file "$notes"
          fi
