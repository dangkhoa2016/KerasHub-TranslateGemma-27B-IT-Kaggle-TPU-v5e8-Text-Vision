name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Unit tests
        run: bash scripts/test_unit.sh
      - name: Documentation parity and public-history hygiene
        run: python scripts/check_docs.py
      - name: Current release contract
        run: |
          version="$(PYTHONPATH=src python -c 'import translategemma_server; print(translategemma_server.__version__)')"
          python scripts/release_contract.py "v${version}"
      - name: Notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("notebooks").glob("*.ipynb"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"VALID JSON: {path}")
          PY
      - name: Python syntax
        run: python -m compileall -q src scripts tests
      - name: Bash syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Node client syntax
        run: node --check clients/node/translategemma-client.mjs
      - name: Secret scan
        run: python scripts/secret_scan.py .
      - name: Build and verify clean source archive
        run: |
          version="$(PYTHONPATH=src python -c 'import translategemma_server; print(translategemma_server.__version__)')"
          archive="/tmp/KerasHub-TranslateGemma-27B-IT-Kaggle-TPU-v5e8-Text-Vision-v${version}.zip"
          python scripts/package_source.py "$archive"
          python scripts/secret_scan.py "$archive"
          unzip -t "$archive"
